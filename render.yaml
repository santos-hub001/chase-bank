services:
  - type: web
    name: chase-bank
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        value: libsql://chase-bank-santos-hub001.aws-us-west-2.turso.io
